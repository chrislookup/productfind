<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stone & Outdoor — Product Lookup</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.5.3/papaparse.min.js"></script>

  <style>
    body { font-family: system-ui, sans-serif; }
    .muted { color:#64748b }
    .card  { background:#fff; border:1px solid #e2e8f0; border-radius:14px; box-shadow:0 1px 2px rgba(0,0,0,.03) }
  </style>
</head>

<body class="bg-slate-50 text-slate-800">
  <div class="max-w-6xl mx-auto p-6 space-y-6">

    <!-- Header -->
    <div class="flex items-center justify-between gap-6">
      <a href="https://www.stoneoutdoor.com.au" target="_blank" rel="noopener">
        <img src="logo.png" alt="Stone & Outdoor" class="h-28 md:h-36 w-auto"/>
      </a>
      <a href="https://www.stoneoutdoor.com.au" target="_blank" rel="noopener"
         class="text-sm text-blue-600 hover:underline whitespace-nowrap">
        stoneoutdoor.com.au
      </a>
    </div>

    <!-- Delivery map -->
    <div class="flex justify-start">
      <a href="https://www.google.com/maps/d/viewer?mid=1kHa9XVylzNZxV5f7ioo60CvtU1HscAY2"
         target="_blank" rel="noopener"
         class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-emerald-600 text-white hover:bg-emerald-700 shadow-sm">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5Z"/>
        </svg>
        Delivery Zone Map & Price Lookup
      </a>
    </div>

    <!-- Search -->
    <div class="card p-4">
      <input id="search" type="text"
             placeholder="Search by name/description or SKU…"
             class="w-full p-3 border rounded-md focus:ring-2 focus:ring-blue-500">
      <div id="status" class="text-sm muted mt-2">Loading latest data…</div>
    </div>

    <!-- Results -->
    <div class="overflow-x-auto card">
      <table class="min-w-full text-sm">
        <thead class="bg-slate-100 text-slate-600">
          <tr>
            <th class="text-left px-4 py-2">SKU</th>
            <th class="text-left px-4 py-2">Name / Description</th>
            <th class="text-right px-4 py-2">Stock</th>
            <th class="text-right px-4 py-2">RRP</th>
          </tr>
        </thead>
        <tbody id="results"></tbody>
      </table>
    </div>

  </div>

  <script>
    /* ================= CONFIG ================= */

    const DROPBOX_SHARE =
      "https://www.dropbox.com/scl/fi/jg9pssmaw0gdogvjps1ii/lookup_summary.csv?rlkey=wu659zpoqfjty6f3ab9ryv2h3&dl=0";

    const CSV_URLS = (() => {
      const u = new URL(DROPBOX_SHARE);
      u.searchParams.delete("st");
      u.searchParams.set("dl", "1");
      const v1 = u.toString();

      const u2 = new URL(v1);
      u2.hostname = "dl.dropboxusercontent.com";
      const v2 = u2.toString();

      const u3 = new URL(v2);
      u3.searchParams.delete("dl");
      const v3 = u3.toString();

      return [v2, v3, v1];
    })();

    const COLS = {
      code:  "barcode",
      name:  "description",
      stock: "available_qty",
      price: "sell_inc"
    };

    /* ================= DOM ================= */

    const statusEl  = document.getElementById('status');
    const resultsEl = document.getElementById('results');
    const searchEl  = document.getElementById('search');

    /* ================= STATE ================= */

    let rows = [];

    /* ================= HELPERS ================= */

    const norm = v => (v==null ? '' : String(v)).toLowerCase().trim();

    const toNumber = v => {
      const n = parseFloat(String(v).replace(/[,\s]/g,''));
      return Number.isFinite(n) ? n : NaN;
    };

    const money = n => {
      const x = toNumber(n);
      return Number.isFinite(x)
        ? new Intl.NumberFormat('en-AU',{style:'currency',currency:'AUD'}).format(x)
        : '';
    };

    function buildIndex(data){
      for(const r of data){
        r.__code  = norm(r[COLS.code]);
        r.__name  = norm(r[COLS.name]);
        r.__blob  = norm(`${r[COLS.code] ?? ''} ${r[COLS.name] ?? ''}`);
        r.__stock = toNumber(r[COLS.stock]);
        r.__price = toNumber(r[COLS.price]);
      }
    }

    function query(q){
      const terms = norm(q).split(/\s+/).filter(Boolean);

      if (!terms.length) {
        return rows.filter(r => r.__stock > 0);
      }

      return rows.filter(r =>
        terms.every(t => r.__blob.includes(t) || r.__code.includes(t))
      );
    }

    function render(list){
      resultsEl.innerHTML = '';
      for(const r of list){
        const tr = document.createElement('tr');
        tr.className = 'odd:bg-white even:bg-slate-50';
        tr.innerHTML = `
          <td class="px-4 py-2">${r[COLS.code] || ''}</td>
          <td class="px-4 py-2">${r[COLS.name] || ''}</td>
          <td class="px-4 py-2 text-right">${Number.isFinite(r.__stock) ? r.__stock.toLocaleString() : ''}</td>
          <td class="px-4 py-2 text-right">${money(r.__price)}</td>
        `;
        resultsEl.appendChild(tr);
      }
      statusEl.textContent = `${list.length.toLocaleString()} match(es)`;
    }

    async function fetchCsv(url){
      const res = await fetch(url, { cache: "no-store" });
      if(!res.ok) throw new Error('Fetch failed');
      const text = await res.text();
      if (/<!doctype html>|<html/i.test(text.slice(0,300))) {
        throw new Error('HTML returned instead of CSV');
      }
      return text;
    }

    async function load(){
      statusEl.textContent = 'Loading latest data…';

      for (const url of CSV_URLS){
        try{
          const text = await fetchCsv(url);

          const parsed = Papa.parse(text, {
            header: true,
            skipEmptyLines: "greedy",
            dynamicTyping: false
          });

          // Ignore ALL CSV warnings silently
          rows = (parsed.data || []).filter(r =>
            r && (r[COLS.code] || r[COLS.name])
          );

          buildIndex(rows);
          render(query(''));

          statusEl.textContent = `Loaded ${rows.length.toLocaleString()} products`;
          return;

        } catch (e){
          console.warn('CSV attempt failed:', url, e);
        }
      }

      statusEl.textContent = '⚠️ Could not load product data';
    }

    let debounce;
    searchEl.addEventListener('input', () => {
      clearTimeout(debounce);
      debounce = setTimeout(() => render(query(searchEl.value)), 120);
    });

    load();
  </script>
</body>
</html>
