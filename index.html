
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stone & Outdoor — Product Lookup</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.5.3/papaparse.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; }
    .muted { color:#64748b }
    .badge { font-size:10px; padding:2px 6px; border-radius:9999px; background:#eef2ff; color:#4338ca }
    .card { background:#fff; border:1px solid #e2e8f0; border-radius:14px; box-shadow:0 1px 2px rgba(0,0,0,.03) }
  </style>
</head>
<body class="bg-slate-50 text-slate-800">
  <div class="max-w-6xl mx-auto p-6 space-y-6">
    <div class="flex items-center justify-between gap-4">
      <h1 class="text-2xl font-semibold flex items-center gap-3">
        <img src="logo.png" alt="Stone & Outdoor" class="h-10 w-auto hidden sm:block"/>
        <span>Stone & Outdoor — Product Lookup</span>
      </h1>
      <span class="badge">Live from Dropbox</span>
    </div>

    <div class="card p-4">
      <div class="flex gap-3 items-center">
        <input id="search" type="text" placeholder="Search by name/description or SKU…" class="w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-500">
      </div>
      <div id="status" class="text-sm muted mt-2">Loading latest data…</div>
      <div id="mapping" class="hidden mt-3 grid grid-cols-1 md:grid-cols-4 gap-3">
        <div>
          <label class="block text-sm mb-1">SKU column</label>
          <select id="colCode" class="w-full p-2 border rounded-md"></select>
        </div>
        <div>
          <label class="block text-sm mb-1">Name/Description column</label>
          <select id="colName" class="w-full p-2 border rounded-md"></select>
        </div>
        <div>
          <label class="block text-sm mb-1">Stock column</label>
          <select id="colStock" class="w-full p-2 border rounded-md"></select>
        </div>
        <div>
          <label class="block text-sm mb-1">RRP column (optional)</label>
          <select id="colPrice" class="w-full p-2 border rounded-md"></select>
        </div>
        <div class="md:col-span-4 text-xs muted">
          Tip: If numbers look wrong, pick the correct stock/RRP header above. Your choice is remembered.
        </div>
      </div>
    </div>

    <div class="overflow-x-auto card">
      <table class="min-w-full text-sm">
        <thead class="bg-slate-100 text-slate-600">
          <tr>
            <th class="text-left px-4 py-2">SKU</th>
            <th class="text-left px-4 py-2">Name / Description</th>
            <th class="text-right px-4 py-2">Stock</th>
            <th class="text-right px-4 py-2">RRP</th>
          </tr>
        </thead>
        <tbody id="results"></tbody>
      </table>
    </div>
  </div>

  <script>
    // === CONFIG ===
    const DROPBOX_DIRECT = "https://dl.dropboxusercontent.com/scl/fi/azkwfwj60sx2vqayrmww0/lookup_summary.csv?rlkey=gn4chbyoewcb75fltvo8r4u4e&dl=1";
    const LSKEY = 'stoneoutdoor:lookup:mapping';

    // === DOM ===
    const statusEl = document.getElementById('status');
    const resultsEl = document.getElementById('results');
    const searchEl  = document.getElementById('search');
    const mappingBox = document.getElementById('mapping');
    const selCode = document.getElementById('colCode');
    const selName = document.getElementById('colName');
    const selStock = document.getElementById('colStock');
    const selPrice = document.getElementById('colPrice');

    // === STATE ===
    let rows = [];
    let cols = { code:null, name:null, stock:null, price:null, allTextCols:[] };

    // === HELPERS ===
    const norm = v => (v==null ? '' : String(v)).toLowerCase();
    const toNumber = v => {
      if (v==null) return NaN;
      const s = String(v).replace(/[,\s]/g,'');
      const n = parseFloat(s);
      return Number.isFinite(n) ? n : NaN;
    };
    const money = n => {
      const x = toNumber(n);
      return Number.isFinite(x) ? new Intl.NumberFormat('en-AU',{style:'currency',currency:'AUD'}).format(x) : '';
    };

    function loadSavedMapping(){
      try { return JSON.parse(localStorage.getItem(LSKEY) || 'null') || null; }
      catch { return null; }
    }
    function saveMapping(){ localStorage.setItem(LSKEY, JSON.stringify(cols)); }

    function detectColumns(headers){
      const H = headers.map(h => String(h).trim());
      const lower = H.map(h => h.toLowerCase());
      const pick = (cands) => {
        let i = lower.findIndex(h => cands.includes(h));
        if (i>=0) return H[i];
        i = lower.findIndex(h => cands.some(c=>h.startsWith(c)));
        return i>=0 ? H[i] : null;
      };
      const code  = pick(['sku','code','product code','item code','item','part','productid','product id','barcode']);
      const name  = pick(['name','description','product','product name','item name','desc','long description']);
      const stock = pick(['stock','qty','quantity','on hand','onhand','soh','available','available_qty']);
      const price = pick(['rrp','sell_inc','price','sell','sell price','sellprice','unit price','unitprice','list price']);
      const numericHints = ['stock','qty','quantity','on hand','onhand','soh','available','available_qty','price','rrp','sell','sell_inc','unit price','unitprice','cost'];
      const allTextCols = H.filter((h,i)=> !numericHints.includes(lower[i]));
      return { code: code||H[0], name: name||H[1]||H[0], stock, price, allTextCols };
    }

    function applyMappingSelectors(headers){
      const opts = headers.map(h=>`<option value="${h}">${h}</option>`).join('');
      selCode.innerHTML  = opts;
      selName.innerHTML  = opts;
      selStock.innerHTML = '<option value="">—</option>'+opts;
      selPrice.innerHTML = '<option value="">—</option>'+opts;
      selCode.value  = cols.code;
      selName.value  = cols.name;
      selStock.value = cols.stock || '';
      selPrice.value = cols.price || '';
      mappingBox.classList.remove('hidden');
    }

    function buildIndex(data){
      for(const r of data){
        r.__code  = norm(r[cols.code]);
        r.__name  = norm(r[cols.name]);
        r.__blob  = norm(cols.allTextCols.map(c=>r[c]).join(' '));
        r.__stock = toNumber(r[cols.stock]);
        r.__price = toNumber(r[cols.price]);
      }
    }

    function query(q){
      const terms = norm(q).split(/\s+/).filter(Boolean);
      if (terms.length === 0) {
        // Default: only non-zero stock
        return rows.filter(r => Number.isFinite(r.__stock) && r.__stock > 0);
      }
      const exact = [], others = [];
      for (const r of rows){
        const ok = terms.every(t => r.__blob.includes(t) || r.__code.includes(t));
        if (!ok) continue;
        if (terms.length===1 && r.__code === terms[0]) exact.push(r);
        else others.push(r);
      }
      const first = terms[0]||'';
      others.sort((a,b)=>{
        const as = a.__code.startsWith(first) || a.__name.startsWith(first);
        const bs = b.__code.startsWith(first) || b.__name.startsWith(first);
        if (as!==bs) return as? -1: 1;
        return a.__name.localeCompare(b.__name);
      });
      return exact.concat(others);
    }

    function render(list){
      resultsEl.innerHTML = '';
      for(const r of list){
        const tr = document.createElement('tr');
        tr.className = 'odd:bg-white even:bg-slate-50';
        tr.innerHTML = `
          <td class="px-4 py-2 whitespace-nowrap">${r[cols.code]??''}</td>
          <td class="px-4 py-2">${r[cols.name]??''}</td>
          <td class="px-4 py-2 text-right tabular-nums">${Number.isFinite(r.__stock)? r.__stock.toLocaleString(): ''}</td>
          <td class="px-4 py-2 text-right tabular-nums">${money(r.__price)}</td>`;
        resultsEl.appendChild(tr);
      }
      statusEl.textContent = `${list.length.toLocaleString()} match(es)`;
    }

    async function load(){
      try{
        statusEl.textContent = 'Fetching CSV…';
        const res = await fetch(DROPBOX_DIRECT);
        if(!res.ok) throw new Error('Network error '+res.status);
        const text = await res.text();
        const parsed = Papa.parse(text,{header:true, skipEmptyLines:true, dynamicTyping:false});
        rows = parsed.data;

        const headers = parsed.meta.fields || Object.keys(rows[0]||{});
        const saved = loadSavedMapping();
        cols = saved || detectColumns(headers);
        applyMappingSelectors(headers);
        buildIndex(rows);
        statusEl.textContent = `Loaded ${rows.length.toLocaleString()} rows.`;
        render(query(''));
      } catch(e){
        console.error(e);
        statusEl.textContent = '⚠️ Could not load CSV. Check Dropbox permissions.';
      }
    }

    // Events
    let t=null;
    searchEl.addEventListener('input', ()=>{ clearTimeout(t); t=setTimeout(()=>{ render(query(searchEl.value)); }, 120); });
    for (const [sel, key] of [[selCode,'code'], [selName,'name'], [selStock,'stock'], [selPrice,'price']]){
      sel.addEventListener('change', ()=>{ cols[key] = sel.value || null; saveMapping(); buildIndex(rows); render(query(searchEl.value)); });
    }

    load();
  </script>
</body>
</html>
