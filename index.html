<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stone & Outdoor — Product Lookup</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.5.3/papaparse.min.js"></script>

  <style>
    body { font-family: system-ui, sans-serif; }
    .muted { color:#64748b }
    .card  { background:#fff; border:1px solid #e2e8f0; border-radius:14px; box-shadow:0 1px 2px rgba(0,0,0,.03) }
  </style>
</head>

<body class="bg-slate-50 text-slate-800">
  <div class="max-w-6xl mx-auto p-6 space-y-6">
    <!-- Header -->
    <div class="flex items-center justify-between gap-6">
      <a href="https://www.stoneoutdoor.com.au" target="_blank" rel="noopener" class="block">
        <img src="logo.png" alt="Stone & Outdoor" class="h-28 md:h-36 w-auto"/>
      </a>
      <a href="https://www.stoneoutdoor.com.au" target="_blank" rel="noopener"
         class="text-sm text-blue-600 hover:underline whitespace-nowrap">stoneoutdoor.com.au</a>
    </div>

    <!-- Delivery price lookup button -->
    <div class="flex justify-start">
      <a href="https://www.google.com/maps/d/viewer?mid=1kHa9XVylzNZxV5f7ioo60CvtU1HscAY2"
         target="_blank" rel="noopener"
         class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-emerald-600 text-white hover:bg-emerald-700 shadow-sm">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5Z"/>
        </svg>
        Delivery Zone Map & Price Lookup
      </a>
    </div>

    <!-- Search + status -->
    <div class="card p-4">
      <input id="search" type="text" placeholder="Search by name/description or SKU…"
             class="w-full p-3 border rounded-md focus:ring-2 focus:ring-blue-500">
      <div id="status" class="text-sm muted mt-2">Loading latest data…</div>
      <div id="debug" class="text-xs muted mt-1 hidden"></div>
    </div>

    <!-- Results -->
    <div class="overflow-x-auto card">
      <table class="min-w-full text-sm">
        <thead class="bg-slate-100 text-slate-600">
          <tr>
            <th class="text-left  px-4 py-2">SKU</th>
            <th class="text-left  px-4 py-2">Name / Description</th>
            <th class="text-right px-4 py-2">Stock</th>
            <th class="text-right px-4 py-2">RRP</th>
          </tr>
        </thead>
        <tbody id="results"></tbody>
      </table>
    </div>
  </div>

  <script>
    // =========================
    // CONFIG
    // =========================

    // Your Dropbox link (share link is fine; code converts it to best direct candidates)
    const DROPBOX_SHARE =
      "https://www.dropbox.com/scl/fi/jg9pssmaw0gdogvjps1ii/lookup_summary.csv?rlkey=wu659zpoqfjty6f3ab9ryv2h3&dl=0";

    // Candidate URLs to try (Dropbox can be fickle across browsers/networks)
    const CSV_URLS = (() => {
      const u = new URL(DROPBOX_SHARE);
      u.searchParams.delete("st");
      u.searchParams.set("dl", "1");
      const v1 = u.toString(); // www.dropbox.com ... dl=1

      const u2 = new URL(v1);
      u2.hostname = "dl.dropboxusercontent.com";
      const v2 = u2.toString(); // dl.dropboxusercontent.com ... dl=1

      const u3 = new URL(v2);
      u3.searchParams.delete("dl");
      const v3 = u3.toString(); // dl.dropboxusercontent.com ... (no dl param)

      return [v2, v3, v1];
    })();

    // Fixed column mapping for your CSV
    const COLS = {
      code:  "barcode",
      name:  "description",
      stock: "available_qty",
      price: "sell_inc"   // shown as RRP
    };

    // =========================
    // DOM
    // =========================
    const statusEl  = document.getElementById('status');
    const resultsEl = document.getElementById('results');
    const searchEl  = document.getElementById('search');
    const debugEl   = document.getElementById('debug');

    // =========================
    // STATE
    // =========================
    let rows = [];

    // =========================
    // HELPERS
    // =========================
    const norm = v => (v==null ? '' : String(v)).toLowerCase().trim();

    const toNumber = v => {
      if (v==null) return NaN;
      const s = String(v).replace(/[,\s]/g,'');
      const n = parseFloat(s);
      return Number.isFinite(n) ? n : NaN;
    };

    const money = n => {
      const x = toNumber(n);
      return Number.isFinite(x)
        ? new Intl.NumberFormat('en-AU',{style:'currency',currency:'AUD'}).format(x)
        : '';
    };

    function setDebug(msg){
      if(!msg){
        debugEl.classList.add('hidden');
        debugEl.textContent = '';
        return;
      }
      debugEl.classList.remove('hidden');
      debugEl.textContent = msg;
    }

    function buildIndex(data){
      for(const r of data){
        r.__code  = norm(r[COLS.code]);
        r.__name  = norm(r[COLS.name]);
        r.__blob  = norm(`${r[COLS.code] ?? ''} ${r[COLS.name] ?? ''}`);
        r.__stock = toNumber(r[COLS.stock]);
        r.__price = toNumber(r[COLS.price]);
      }
    }

    function query(q){
      const terms = norm(q).split(/\s+/).filter(Boolean);

      // Default: only non-zero stock
      if (terms.length === 0) {
        return rows.filter(r => Number.isFinite(r.__stock) && r.__stock > 0);
      }

      const one = (terms.length === 1) ? terms[0] : null;

      const matched = rows.filter(r => {
        return terms.every(t => r.__blob.includes(t) || r.__code.includes(t));
      });

      matched.sort((a,b)=>{
        if(one){
          const aExact = a.__code === one;
          const bExact = b.__code === one;
          if(aExact !== bExact) return aExact ? -1 : 1;

          const aStarts = a.__code.startsWith(one) || a.__name.startsWith(one);
          const bStarts = b.__code.startsWith(one) || b.__name.startsWith(one);
          if(aStarts !== bStarts) return aStarts ? -1 : 1;
        }
        return a.__name.localeCompare(b.__name);
      });

      return matched;
    }

    function render(list){
      resultsEl.innerHTML = '';
      for(const r of list){
        const tr = document.createElement('tr');
        tr.className = 'odd:bg-white even:bg-slate-50';
        tr.innerHTML = `
          <td class="px-4 py-2 whitespace-nowrap">${r[COLS.code] ?? ''}</td>
          <td class="px-4 py-2">${r[COLS.name] ?? ''}</td>
          <td class="px-4 py-2 text-right tabular-nums">${Number.isFinite(r.__stock) ? r.__stock.toLocaleString() : ''}</td>
          <td class="px-4 py-2 text-right tabular-nums">${money(r.__price)}</td>
        `;
        resultsEl.appendChild(tr);
      }
      statusEl.textContent = `${list.length.toLocaleString()} match(es)`;
    }

    async function fetchTextWithTimeout(url, ms){
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), ms);
      try{
        const res = await fetch(url, { cache: "no-store", signal: controller.signal });
        if(!res.ok){
          const body = await res.text().catch(() => '');
          throw new Error(`HTTP ${res.status} ${res.statusText} | ${body.slice(0,160)}`);
        }
        const ct = (res.headers.get('content-type') || '').toLowerCase();
        const text = await res.text();

        // If Dropbox returns HTML/login/redirect page, treat as failure
        if (ct.includes('text/html') || /<!doctype html>|<html/i.test(text.slice(0,300))){
          throw new Error('Dropbox returned HTML instead of CSV (permissions/link redirect).');
        }

        // Quick sanity check
        if (!text.includes(',')) throw new Error('Response does not look like CSV.');

        return text;
      } finally {
        clearTimeout(timer);
      }
    }

    function parseCsvNeverFail(text){
      // IMPORTANT: we NEVER throw on Papa parse errors like TooManyFields.
      // We still load whatever rows Papa produced.
      const parsed = Papa.parse(text, {
        header: true,
        skipEmptyLines: "greedy",
        dynamicTyping: false,
        quoteChar: '"',
        escapeChar: '"'
      });

      const data = (parsed.data || []).filter(r =>
        r && (String(r[COLS.code] || '').trim() || String(r[COLS.name] || '').trim())
      );

      const errors = (parsed.errors || []);
      const tooMany = errors.filter(e => e && (e.code === "TooManyFields" || String(e.message || '').toLowerCase().includes('too many fields')));

      return { data, errors, tooMany };
    }

    async function load(){
      statusEl.textContent = 'Loading latest data…';
      setDebug('');

      let lastErr = null;

      for (let i = 0; i < CSV_URLS.length; i++){
        const url = CSV_URLS[i];
        try{
          statusEl.textContent = 'Fetching CSV…';
          const text = await fetchTextWithTimeout(url, 15000);

          statusEl.textContent = 'Parsing CSV…';
          const { data, errors, tooMany } = parseCsvNeverFail(text);

          if (!data.length){
            throw new Error('Parsed zero rows (CSV empty or headers changed).');
          }

          rows = data;
          buildIndex(rows);

          // NOTE: Even if there are parse errors, we still load and show results.
          const warningCount = errors.length;
          if (warningCount){
            statusEl.textContent = `Loaded ${rows.length.toLocaleString()} rows (warning: ${warningCount} row issue(s)).`;
            const extra = tooMany.length ? ` TooManyFields: ${tooMany.length}.` : '';
            setDebug(`CSV loaded with warnings.${extra} (Tried URL ${i+1}/${CSV_URLS.length})`);
          } else {
            statusEl.textContent = `Loaded ${rows.length.toLocaleString()} rows.`;
            setDebug('');
          }

          render(query(''));
          return;

        } catch(e){
          lastErr = e;
          console.warn('CSV load attempt failed:', url, e);
          statusEl.textContent = `Trying another CSV link… (${i+1}/${CSV_URLS.length})`;
        }
      }

      console.error(lastErr);
      statusEl.textContent = '⚠️ Could not load CSV. Check Dropbox permissions / link.';
      setDebug(String(lastErr && lastErr.message ? lastErr.message : lastErr).slice(0, 220));
    }

    // Search
    let t=null;
    searchEl.addEventListener('input', ()=>{
      clearTimeout(t);
      t=setTimeout(()=>{ render(query(searchEl.value)); }, 120);
    });

    load();
  </script>
</body>
</html>
