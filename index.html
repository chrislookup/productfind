<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nuway Product Lookup</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.5.3/papaparse.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; }
    .loading { animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100% {opacity:.4} 50%{opacity:1} }
  </style>
</head>
<body class="bg-slate-50 text-slate-800">
  <div class="max-w-4xl mx-auto p-6">
    <h1 class="text-2xl font-semibold mb-4">Nuway Product Lookup</h1>
    <p class="text-sm text-slate-600 mb-4">Automatically connected to your Dropbox file. It updates daily — just search below.</p>

    <div class="mb-4">
      <input id="search" type="text" placeholder="Search by product name or code..." class="w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-500">
    </div>
    <div id="status" class="text-sm text-slate-600 mb-4">Loading latest data...</div>

    <table class="min-w-full bg-white shadow rounded-lg overflow-hidden">
      <thead class="bg-slate-100 text-slate-600">
        <tr>
          <th class="text-left px-4 py-2">Code</th>
          <th class="text-left px-4 py-2">Name</th>
          <th class="text-right px-4 py-2">Stock</th>
          <th class="text-right px-4 py-2">Price</th>
        </tr>
      </thead>
      <tbody id="results"></tbody>
    </table>
  </div>

  <script>
    const dropboxUrl = "https://dl.dropboxusercontent.com/scl/fi/azkwfwj60sx2vqayrmww0/lookup_summary.csv?rlkey=gn4chbyoewcb75fltvo8r4u4e&dl=1";
    const status = document.getElementById('status');
    const results = document.getElementById('results');
    const search = document.getElementById('search');
    let data = [];

    async function loadData() {
      try {
        status.textContent = 'Fetching data...';
        const res = await fetch(dropboxUrl);
        if (!res.ok) throw new Error('Network error');
        const text = await res.text();
        const parsed = Papa.parse(text, { header: true, skipEmptyLines: true });
        data = parsed.data;
        status.textContent = `Loaded ${data.length.toLocaleString()} products.`;
        render(data);
      } catch (e) {
        console.error(e);
        status.textContent = '⚠️ Could not load CSV. Please check the Dropbox link permissions.';
      }
    }

    function render(rows) {
      results.innerHTML = '';
      for (const row of rows) {
        const tr = document.createElement('tr');
        tr.className = 'odd:bg-white even:bg-slate-50';
        tr.innerHTML = `
          <td class='px-4 py-2'>${row.SKU || row.Code || ''}</td>
          <td class='px-4 py-2'>${row.Name || row.Product || ''}</td>
          <td class='px-4 py-2 text-right'>${row.Stock || row.Qty || ''}</td>
          <td class='px-4 py-2 text-right'>${row.Price || ''}</td>`;
        results.appendChild(tr);
      }
    }

    search.addEventListener('input', () => {
      const q = search.value.toLowerCase();
      const filtered = data.filter(r => (r.Name || '').toLowerCase().includes(q) || (r.SKU || r.Code || '').toLowerCase().includes(q));
      render(filtered);
    });

    loadData();
  </script>
</body>
</html>
